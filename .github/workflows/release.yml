name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.7.0)'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set publish flags
        id: flags
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_CREATED: ${{ steps.release.outputs.releases_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            VERSION="$INPUT_VERSION"
          else
            echo "should_publish=$RELEASE_CREATED" >> "$GITHUB_OUTPUT"
            VERSION="$RELEASE_TAG"
          fi

          VERSION="${VERSION#v}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.flags.outputs.should_publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.flags.outputs.ref }}

      - name: Setup Java
        if: steps.flags.outputs.should_publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Package Project
        if: steps.flags.outputs.should_publish == 'true'
        run: mvn -B -DskipTests package

      - name: Publish Docker Image
        if: steps.flags.outputs.should_publish == 'true'
        uses: tada5hi/craneship@v4
        with:
          registryTag: |
            latest
            ${{ steps.flags.outputs.version }}
